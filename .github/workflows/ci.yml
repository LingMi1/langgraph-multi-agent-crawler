name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖（requirements.lock 精确锁定版本，保证 CI 可复现）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install pytest pytest-asyncio pytest-cov
          pip install ruff mypy

      - name: 单元测试（safety / plan / BaseAgent / 工具 / 记账 / ReAct / 去重 / 图装配冒烟）
        run: python -m pytest tests -q

      - name: 覆盖率（核心包 agents/graph/distributed/api ≥ 60%，渐进加码）
        run: python -m pytest tests -q --cov=agents --cov=graph --cov=distributed --cov=api --cov-fail-under=60 --cov-report=term-missing

      - name: 静态检查（自研 stdlib 版：F401/F403/F811/F821 + ANNO 注解完备性门禁）
        run: python tools/static_check.py

      - name: 静态检查（ruff 交叉验证，同规则子集）
        run: ruff check --select F401,F403,F811,F821 .

      - name: Markdown 相对链接检查（README / docs 截图与文档链接）
        run: python tools/check_links.py

      - name: 类型检查（mypy，渐进式提示项；强制项为 ANNO 门禁，不阻塞构建）
        continue-on-error: true
        run: mypy distributed api agents/budget.py agents/safety.py agents/interfaces.py agents/tools.py agents/react.py tools/golden_check.py

      - name: Trace 分析器冒烟
        run: python -c "import ast,sys; ast.parse(open('tools/analyze_trace.py',encoding='utf-8').read())"

      - name: Golden 清单校验
        run: python tools/golden_check.py --list

      - name: 提示词版本管理（sha256 基线漂移检测）
        run: python tools/prompt_registry.py --check
