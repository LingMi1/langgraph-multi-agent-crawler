# pre-commit 配置 — 提交前本地门禁
# 安装：pip install pre-commit && pre-commit install
# 手动跑：pre-commit run --all-files
#
# 规则说明：
#   - ruff 与 CI 同规则子集（F401/F403/F811/F821），与自研 static_check 交叉验证
#   - static_check 为项目内自研 stdlib AST 检查器（ANNO 注解完备性门禁）
#   - check_links 校验 Markdown 相对链接（README / docs 的截图与文档链接）
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      - id: ruff
        args: [--select, F401,F403,F811,F821]

  - repo: local
    hooks:
      - id: static-check
        name: static-check (ANNO gate)
        entry: python tools/static_check.py
        language: system
        pass_filenames: false
      - id: check-links
        name: check-links (markdown relative links)
        entry: python tools/check_links.py
        language: system
        pass_filenames: false
