<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>任务工作台 · 校招版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Noto+Sans+SC:wght@400;500&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <header>
      <div class="brand">
        <h1 id="app_title">任务工作台</h1>
        <span class="ver" id="app_ver">v2.0 · 校招版</span>
        <span class="env" id="env_badge"></span>
      </div>
      <div class="topbar">
        <select class="runner-sel" id="runner_sel" title="切换业务（验证可替换架构）"></select>
        <button class="icon-btn" id="btn_theme" title="切换深浅主题">☾</button>
      </div>
      <div class="controls">
        <button class="btn btn-start" id="btn_start" disabled>开始任务</button>
        <button class="btn btn-pause" id="btn_pause" disabled>暂停</button>
        <button class="btn btn-stop" id="btn_stop" disabled>结束任务</button>
        <span class="kbd-hints"><span><kbd>Enter</kbd>开始</span><span><kbd>Esc</kbd>结束</span></span>
      </div>
    </header>

    <div class="statusbar">
      <div class="bar"><div class="bar-fill" id="bar_fill"></div></div>
      <div class="status" id="status">就绪 · 选择业务后配置参数</div>
    </div>

    <main>
      <!-- 左栏：动态表单（由业务 schema 生成） -->
      <aside class="col-config">
        <section class="panel">
          <span class="eyebrow">Configuration</span>
          <div class="form" id="form"></div>
          <div class="keys-box" id="keys_box" hidden>
            <hr class="divider">
            <div class="row"><label>保存的 Key</label>
              <div class="inline">
                <select class="field grow" id="saved_keys">
                  <option value="">— 选择已保存 —</option>
                </select>
                <button class="btn-ghost danger" id="btn_del_key">删</button>
              </div>
            </div>
            <div class="row"><label>保存当前 Key 为</label>
              <div class="inline">
                <input class="field grow" id="key_name" type="text" placeholder="名称，如 deepseek-生产">
                <button class="btn-ghost" id="btn_save_key">存</button>
              </div>
            </div>
          </div>
        </section>
      </aside>

      <!-- 右栏：统计 + 日志 + 汇总 -->
      <section class="col-run">
        <div class="panel stats-panel">
          <span class="eyebrow">Live Stats</span>
          <div class="stats">
            <div class="stat"><div class="stat-num" id="stat_total">–</div><div class="stat-label">总任务</div></div>
            <div class="stat"><div class="stat-num" id="stat_done">–</div><div class="stat-label">已完成</div></div>
            <div class="stat"><div class="stat-num" id="stat_failed">–</div><div class="stat-label">失败</div></div>
            <div class="stat"><div class="stat-num" id="stat_queue">–</div><div class="stat-label">队列</div></div>
            <div class="stat"><div class="stat-num" id="stat_percent">–</div><div class="stat-label">进度</div></div>
          </div>
        </div>

        <div class="panel log-panel">
          <span class="eyebrow">Run Log <span class="log-count" id="log_count"></span></span>
          <div class="log-box" id="log">
            <div class="empty" id="log_empty">暂无日志 —— 点击「开始任务」运行</div>
          </div>
        </div>

        <div class="panel skip-panel">
          <span class="eyebrow">Summary / Output</span>
          <div class="skip-box" id="summary">
            <div class="empty" id="summary_empty">运行后显示汇总 / 输出</div>
          </div>
        </div>
      </section>
    </main>

  </div>

  <div class="toasts" id="toasts"></div>
  <script src="app.js"></script>
</body>
</html>
